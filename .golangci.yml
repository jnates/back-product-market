version: "2"

run:
  tests: false

linters:
  disable-all: true
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 15
    funlen:
      lines: 150
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - regexpMust
        - rangeValCopy
      enabled-tags:
        - performance
      disabled-tags:
        - experimental
      settings:
        captLocal:
          paramsOnly: true
        elseif:
          skipBalanced: true
        hugeParam:
          sizeThreshold: 800
        rangeExprCopy:
          sizeThreshold: 512
          skipTestFuncs: true
        underef:
          skipRecvDeref: true
    gocyclo:
      min-complexity: 15
    govet:
      settings:
        printf:
          funcs:
            - (github.com/rs/zerolog.Event).Msgf
    lll:
      line-length: 130
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
    misspell:
      locale: US
    nolintlint:
      allow-no-explanation: []
      require-explanation: false
      require-specific: false
  exclusions:
    paths:
      - mocks
    rules:
      - path: _test\.go$
        linters:
          - mnd
          - funlen
          - gocyclo
          - unused
      - path: \.go$
        linters:
          - gochecknoinits

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: backend_crudgo
