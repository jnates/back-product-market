version: "2"

run:
  tests: false

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - errname
    - funlen
    - goconst
    - gocognit
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 15
    errcheck:
      asserts: true
    funlen:
      lines: 40
      statements: 30
    goconst:
      min-len: 2
      min-occurrences: 2
    gocognit:
      min-complexity: 10
    gocritic:
      disabled-checks:
        - regexpMust
        - rangeValCopy
      enabled-tags:
        - performance
      disabled-tags:
        - experimental
      settings:
        captLocal:
          paramsOnly: true
        elseif:
          skipBalanced: true
        hugeParam:
          sizeThreshold: 800
        rangeExprCopy:
          sizeThreshold: 512
          skipTestFuncs: true
        underef:
          skipRecvDeref: true
    gocyclo:
      min-complexity: 9
    govet:
      settings:
        printf:
          funcs:
            - (github.com/rs/zerolog.Event).Msgf
    lll:
      line-length: 130
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
    misspell:
      locale: US
    nolintlint:
      allow-no-explanation: []
      require-explanation: false
      require-specific: false
    revive:
      ignore-generated-header: false
      severity: warning
      confidence: 0.3
      error-code: 1
      warning-code: 1
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: get-return
        - name: early-return
        - name: identical-branches
        - name: defer
          arguments:
            - - loop
              - method-call
              - return
        - name: string-of-int
        - name: waitgroup-by-value
        - name: range-val-address
        - name: argument-limit
          arguments:
            - 4
        - name: atomic
        - name: bool-literal-in-expr
        - name: deep-exit
        - name: function-result-limit
          arguments:
            - 3
        - name: modifies-value-receiver
        - name: modifies-parameter
        - name: unnecessary-stmt
  exclusions:
    paths:
      - mocks
      - docs
    rules:
      - path: _test\.go$
        linters:
          - mnd
          - funlen
          - gocyclo
          - gocognit
          - gosec
          - unused
      - path: \.go$
        linters:
          - gochecknoinits
      - linters:
          - gosec
        text: "G104"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - backend_crudgo
